quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.enabled=false
quarkus.compose.devservices.enabled=false
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://127.0.0.1:15432/failurelab
%dev.quarkus.datasource.username=lab
%dev.quarkus.datasource.password=local-lab-only
%dev.kafka.bootstrap.servers=127.0.0.1:29092
quarkus.kafka.devservices.enabled=false

mp.messaging.incoming.reservations.connector=smallrye-kafka
mp.messaging.incoming.reservations.topic=reservation.accepted.v1
mp.messaging.incoming.reservations.group.id=failure-lab-fulfillment
mp.messaging.incoming.reservations.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.reservations.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.reservations.auto.offset.reset=earliest
mp.messaging.incoming.reservations.enable.auto.commit=false
mp.messaging.incoming.reservations.commit-strategy=throttled
mp.messaging.incoming.reservations.failure-strategy=fail
mp.messaging.incoming.reservations.auto.commit.interval.ms=500
mp.messaging.incoming.reservations.session.timeout.ms=6000
mp.messaging.incoming.reservations.heartbeat.interval.ms=2000
