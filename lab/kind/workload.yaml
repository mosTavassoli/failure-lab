apiVersion: v1
kind: Namespace
metadata:
  name: failure-lab
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lab-connections
  namespace: failure-lab
data:
  QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/failurelab
  QUARKUS_DATASOURCE_USERNAME: lab
  QUARKUS_DATASOURCE_PASSWORD: local-lab-only
  KAFKA_BOOTSTRAP_SERVERS: kafka.failure-lab.svc.cluster.local:9092
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: failure-lab
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: failure-lab
spec:
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - name: POSTGRES_DB
              value: failurelab
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: lab-connections
                  key: QUARKUS_DATASOURCE_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: lab-connections
                  key: QUARKUS_DATASOURCE_PASSWORD
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 384Mi}
          readinessProbe:
            exec:
              command: [pg_isready, "-h", 127.0.0.1, "-U", lab, "-d", failurelab]
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: failure-lab
spec:
  selector:
    app: kafka
  ports:
    - port: 9092
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: failure-lab
spec:
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      automountServiceAccountToken: false
      containers:
        - name: kafka
          image: apache/kafka:4.1.1
          env:
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@127.0.0.1:9093"}
            - {name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka.failure-lab.svc.cluster.local:9092"}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
            - {name: KAFKA_INTER_BROKER_LISTENER_NAME, value: PLAINTEXT}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS, value: "5"}
            - {name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0"}
            - {name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false"}
            - {name: KAFKA_HEAP_OPTS, value: "-Xms128m -Xmx256m"}
            - {name: KAFKA_JVM_PERFORMANCE_OPTS, value: "-XX:ActiveProcessorCount=2"}
          resources:
            requests: {cpu: 250m, memory: 384Mi}
            limits: {memory: 768Mi}
          readinessProbe:
            tcpSocket:
              port: 9092
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: reservation-api
  namespace: failure-lab
spec:
  selector:
    app: reservation-api
  ports:
    - port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reservation-api
  namespace: failure-lab
spec:
  selector:
    matchLabels:
      app: reservation-api
  template:
    metadata:
      labels:
        app: reservation-api
    spec:
      automountServiceAccountToken: false
      containers:
        - name: reservation-api
          image: failure-lab/reservation-api:run
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: lab-connections
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 384Mi}
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fulfillment-worker
  namespace: failure-lab
spec:
  selector:
    matchLabels:
      app: fulfillment-worker
  template:
    metadata:
      labels:
        app: fulfillment-worker
    spec:
      automountServiceAccountToken: false
      containers:
        - name: fulfillment-worker
          image: failure-lab/fulfillment-worker:run
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: lab-connections
          env:
            - {name: FAILURE_LAB_LAB_MODE, value: "true"}
            - {name: FAILURE_LAB_PROCESSING_DELAY_MS, value: "2000"}
            - {name: MP_MESSAGING_INCOMING_RESERVATIONS_THROTTLED_UNPROCESSED_RECORD_MAX_AGE_MS, value: "180000"}
          resources:
            requests: {cpu: 250m, memory: 128Mi}
            limits: {memory: 384Mi}
