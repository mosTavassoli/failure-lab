quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=postgres:17-alpine
quarkus.datasource.devservices.reuse=false
quarkus.compose.devservices.enabled=false
quarkus.flyway.migrate-at-start=true
%dev.quarkus.flyway.locations=db/migration,db/demo
%dev.quarkus.http.host=127.0.0.1
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://127.0.0.1:15432/failurelab
%dev.quarkus.datasource.username=lab
%dev.quarkus.datasource.password=local-lab-only
%dev.kafka.bootstrap.servers=127.0.0.1:29092

quarkus.kafka.devservices.enabled=false
mp.messaging.outgoing.reservation-events.connector=smallrye-kafka
mp.messaging.outgoing.reservation-events.topic=reservation.accepted.v1
mp.messaging.outgoing.reservation-events.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.reservation-events.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.reservation-events.acks=all
mp.messaging.outgoing.reservation-events.enable.idempotence=true
mp.messaging.outgoing.reservation-events.request.timeout.ms=3000
mp.messaging.outgoing.reservation-events.delivery.timeout.ms=5000
mp.messaging.outgoing.reservation-events.max.block.ms=3000
%test.mp.messaging.outgoing.reservation-events.enabled=false
